apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-learning-app
  labels:
    app: devops-learning-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: devops-learning-app
  template:
    metadata:
      labels:
        app: devops-learning-app
    spec:
      containers:
        - name: devops-learning-app
          image: 213320332925.dkr.ecr.us-east-1.amazonaws.com/devops-learning-app:c08b3e0fc2ded80fbcd5d706fb52e0753555dbe7
          imagePullPolicy: Always
          ports:
            - containerPort: 80
